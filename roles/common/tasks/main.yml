---
# common: base OS setup — hostnames, /etc/hosts, time sync, utilities
- name: Common | Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  tags: [common]

- name: Common | Ensure /etc/hosts contains cluster entries (idempotent)
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: "^{{ item.ip }}\\s+{{ item.name }}(\\s|$)"
    line: "{{ item.ip }} {{ item.name }}"
    state: present
    create: true
    mode: "0644"
  loop:
    - { ip: "10.100.0.1", name: "db01" }
    - { ip: "10.100.0.2", name: "db02" }
    - { ip: "10.100.0.3", name: "db03" }
  tags: [common]

- name: Common | Install base utilities and time sync
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - chrony
      - ufw
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
      - iputils-arping
      - iputils-ping
      - netcat-openbsd
      - keepalived
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags: [common]

- name: Common | Enable and start chrony
  ansible.builtin.systemd:
    name: chrony
    enabled: true
    state: started
  tags: [common]

- name: Common | Create service directories with correct permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default('root') }}"
    group: "{{ item.group | default('root') }}"
    mode: "{{ item.mode | default('0755') }}"
  loop:
    - { path: "{{ mysql_compose_dir }}" }
    - { path: "{{ mysql_config_dir }}", mode: "0755" }
    - { path: "{{ mysql_secrets_dir }}", mode: "0700" }
    - { path: "{{ orchestrator_data_dir }}", owner: "{{ orchestrator_container_uid }}", group: "{{ orchestrator_container_gid }}", mode: "0750" }
    - { path: "{{ orchestrator_config_dir }}", owner: "{{ orchestrator_container_uid }}", group: "{{ orchestrator_container_gid }}", mode: "0750" }
    - { path: "{{ mysql_logs_dir }}", owner: "{{ mysql_container_uid }}", group: "{{ mysql_container_gid }}", mode: "0750" }
    - { path: "{{ mysql_run_dir }}", owner: "{{ mysql_container_uid }}", group: "{{ mysql_container_gid }}", mode: "0750" }
  tags: [common, mysql]

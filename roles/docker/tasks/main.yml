---
# docker role: install Docker Engine + Compose plugin from official repo
- name: Docker | Remove conflicting distro packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-doc
      - docker-compose
      - podman-docker
      - containerd
      - runc
    state: absent
  tags: [docker]

- name: Docker | Install keyring dependencies
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg]
    state: present
  tags: [docker]

- name: Docker | Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [docker]

- name: Docker | Download Docker GPG key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
  tags: [docker]

- name: Docker | Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
  tags: [docker]

- name: Docker | Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    name:
      - "docker-ce={{ docker_engine_package_versions[ansible_distribution][ansible_distribution_major_version] }}"
      - "docker-ce-cli={{ docker_engine_package_versions[ansible_distribution][ansible_distribution_major_version] }}"
      - "containerd.io={{ containerd_package_versions[ansible_distribution][ansible_distribution_major_version] }}"
      - "docker-compose-plugin={{ docker_compose_package_versions[ansible_distribution][ansible_distribution_major_version] }}"
    state: present
    update_cache: true
  tags: [docker]

- name: Docker | Enable and start Docker service
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started
  tags: [docker]

- name: Docker | Verify docker compose plugin
  ansible.builtin.command: docker compose version
  register: _docker_compose_version
  changed_when: false
  tags: [docker]

- name: Docker | Show docker versions
  ansible.builtin.debug:
    msg: "{{ _docker_compose_version.stdout }}"
  changed_when: false
  tags: [docker]
